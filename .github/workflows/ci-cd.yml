name: CI/CD Pipeline — Backend & GCP Compute Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =============================================================
  # Job 1: Continuous Integration — Backend Tests
  # =============================================================
  ci-backend-tests:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: "backend"
          DATABASE_URL: "sqlite:///:memory:"
          API_KEY_HMAC_SECRET: "test_secret_hmac_12345678901234567890123456789012"
          JWT_SECRET: "test_jwt_secret_12345678901234567890123456789012"
          MERCHANT_TOKEN_ENCRYPTION_KEY: "Y4j_PL8CU6g4fFlJTSOA1zs3VWh2nV6Jd3hs-sLNRY8="
          RAZORPAY_KEY_ID: "rzp_test_mockkey123"
          RAZORPAY_KEY_SECRET: "mock_secret_key_123456"
        run: |
          python -m pytest backend/app/tests -v

  # =============================================================
  # Job 2: Continuous Deployment — GCP Compute Engine
  # =============================================================
  cd-gcp-deploy:
    name: Deploy to GCP Compute Engine
    needs: ci-backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID || 'learncloud-501101' }}

      # Deploy to GCP VM via SSH
      - name: Deploy via SSH to GCP Compute Engine
        run: |
          gcloud compute ssh \
            --zone "us-central1-a" \
            "instance-20260901-190452" \
            --project "${{ secrets.GCP_PROJECT_ID || 'learncloud-501101' }}" \
            --quiet \
            --command '
              set -e

              echo "=========================================="
              echo "Starting deployment"
              echo "=========================================="

              REPO_DIR="/home/VIJAY/shopagent_ai"
              ENV_SOURCE="/home/VIJAY/.env"
              ENV_DEST="$REPO_DIR/backend/.env"

              if [ ! -d "$REPO_DIR" ]; then
                echo "ERROR: Repository directory not found: $REPO_DIR"
                exit 1
              fi

              cd "$REPO_DIR"
              echo "==> Repository: $REPO_DIR"

              echo "==> Fetching latest main..."
              git fetch origin main

              echo "==> Resetting repository to origin/main..."
              git reset --hard origin/main

              if [ -f "$ENV_SOURCE" ]; then
                echo "==> Copying production .env..."
                cp "$ENV_SOURCE" "$ENV_DEST"
                chmod 600 "$ENV_DEST"
              fi

              cd "$REPO_DIR/backend"

              echo "==> Stopping existing containers..."
              docker compose down

              echo "==> Building and starting containers..."
              docker compose up -d --build

              echo "==> Waiting for backend to start..."
              sleep 5

              echo "==> Running health check..."
              curl --fail --silent --show-error http://localhost:8000/ > /dev/null

              echo "=========================================="
              echo "Deployment successfully verified!"
              echo "=========================================="
            '