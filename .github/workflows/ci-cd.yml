name: CI/CD Pipeline — Backend & GCP Compute Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # Job 1: Continuous Integration (CI) — Backend Tests
  # -------------------------------------------------------------
  ci-backend-tests:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          API_KEY_HMAC_SECRET: "test_secret_hmac_12345678901234567890123456789012"
          JWT_SECRET: "test_jwt_secret_12345678901234567890123456789012"
          MERCHANT_TOKEN_ENCRYPTION_KEY: "Y4j_PL8CU6g4fFlJTSOA1zs3VWh2nV6Jd3hs-sLNRY8="
        run: |
          python -m pytest backend/app/tests -v

  # -------------------------------------------------------------
  # Job 2: Continuous Deployment (CD) — GCP Compute Engine SSH
  # -------------------------------------------------------------
  cd-gcp-deploy:
    name: Deploy to GCP Compute Engine
    needs: ci-backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID || 'learncloud-501101' }}

      - name: Deploy via SSH to GCP Compute Engine
        run: |
          gcloud compute ssh --zone "us-central1-a" "instance-20260901-190452" --project "${{ secrets.GCP_PROJECT_ID || 'learncloud-501101' }}" --quiet --command "
            set -e
            echo '==> Navigating to repository directory...'
            if [ -d '~/rzp_bthon' ]; then
              cd ~/rzp_bthon
            elif [ -d '~/rzp_bthon/backend' ]; then
              cd ~/rzp_bthon
            else
              cd ~/
            fi

            echo '==> Pulling latest changes from main branch...'
            git pull origin main

            echo '==> Building and deploying Docker containers...'
            cd backend
            docker compose up -d --build

            echo '==> Running post-deployment health check...'
            sleep 5
            curl -f http://localhost:8000/ || exit 1
            echo '==> Deployment successfully verified!'
          "
